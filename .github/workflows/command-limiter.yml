name: Command limiter tests

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  command-limiter:
    name: Command limiter tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run command limiter tests
        run: npm run test:limiter

      - name: Check JavaScript syntax
        run: |
          npm run check:syntax
          node --check limitador.js
